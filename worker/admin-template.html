<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Visitor Stats</title>
<link rel="stylesheet" href="style.css">
<style>
.bar-row{display:grid;grid-template-columns:52px 1fr 64px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bar-track{background:var(--bg3);border-radius:6px;height:18px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--amber));border-radius:6px}
.bar-row .cc{font-family:var(--mono);color:var(--amber);font-weight:700}
.bar-row .n{text-align:right;color:var(--dim);font-family:var(--mono)}
.day{margin:22px 0 8px;color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:1px}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="index.html">Telegram<span class="dot">Scammers</span>.com</a>
  <nav><a href="index.html">Home</a></nav>
</div></header>
<div class="wrap">
<section>
  <div class="kicker">Admin only</div>
  <h2>Where visitors come from</h2>
  <p class="muted" id="summary">Loading…</p>
  <div class="card"><div id="countries"></div></div>
  <h3>Last 14 days</h3>
  <div id="days"></div>
  <p class="muted" style="margin-top:24px;font-size:13px">Aggregate country data only — no individual visitors are identified. VPNs can distort locations.</p>
</section>
</div>
<script>
const WORKER = "__WORKER_URL__";
const TOKEN = "__ADMIN_TOKEN__";
const NAMES = {US:"United States",GB:"United Kingdom",CA:"Canada",AU:"Australia",DE:"Germany",FR:"France",NG:"Nigeria",IN:"India",PK:"Pakistan",PH:"Philippines",GH:"Ghana",KE:"Kenya",ZA:"South Africa",BR:"Brazil",MX:"Mexico",RU:"Russia",UA:"Ukraine",NL:"Netherlands",ES:"Spain",IT:"Italy",SE:"Sweden",NO:"Norway",IE:"Ireland",NZ:"New Zealand",SG:"Singapore",MY:"Malaysia",ID:"Indonesia",AE:"United Arab Emirates",SA:"Saudi Arabia",TR:"Turkey",XX:"Unknown"};
fetch(`${WORKER}/stats?token=${TOKEN}`)
  .then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(d => {
    document.getElementById("summary").textContent =
      `${d.total.toLocaleString()} visits logged since tracking began.`;
    const entries = Object.entries(d.countries).filter(([c])=>c!=="_total").sort((a,b)=>b[1]-a[1]);
    const max = entries.length ? entries[0][1] : 1;
    document.getElementById("countries").innerHTML = entries.map(([c,n])=>`
      <div class="bar-row"><span class="cc">${c}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,Math.round(n/max*100))}%"></div></div>
      <span class="n">${n.toLocaleString()}</span></div>
      <div style="font-size:12px;color:var(--dim);margin:-2px 0 6px 62px">${NAMES[c]||c}</div>`).join("")
      || '<p class="muted">No visits logged yet.</p>';
    const days = Object.keys(d.byDay).sort().reverse().slice(0,14);
    document.getElementById("days").innerHTML = days.map(day=>{
      const tot = d.byDay[day]["_total"]||0;
      const top = Object.entries(d.byDay[day]).filter(([c])=>c!=="_total").sort((a,b)=>b[1]-a[1]).slice(0,5)
        .map(([c,n])=>`${c} ${n}`).join(" · ");
      return `<div class="day">${day} — ${tot} visits</div><div class="muted" style="font-size:14px">${top||"—"}</div>`;
    }).join("") || '<p class="muted">No daily data yet.</p>';
  })
  .catch(()=>{ document.getElementById("summary").textContent = "Could not load stats."; });
</script>
</body>
</html>
